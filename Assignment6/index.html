<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>

    <form id="registrationForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>
        <br><br>

        <fieldset>
            <legend>Gender:</legend>
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
        </fieldset>
        <br>

        <fieldset>
            <legend>Study Mode:</legend>
            <label><input type="radio" name="studyMode" value="regular" required> Regular</label>
            <label><input type="radio" name="studyMode" value="distance"> Distance</label>
        </fieldset>
        <br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <small>Use at least 9 characters with letters, numbers, and a special character.</small>
        <br><br>

        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <br><br>

        <label>
            <input type="checkbox" id="terms" name="terms" required>
            I accept the terms and conditions
        </label>
        <br><br>

        <button type="submit">Submit</button>
        <p id="message"></p>
    </form>

    <script src="script.js"></script>
</body>
</html>
